appId: com.fraktole.desktop
productName: Fraktole
executableName: fraktole-desktop
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
linux:
  target:
    - dir
    - AppImage
  icon: build/icon.png
  category: Development
  maintainer: Fraktole
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
