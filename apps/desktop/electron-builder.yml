appId: com.fraktole.desktop
productName: Fraktole
executableName: fraktole-desktop
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  maintainer: Fraktole
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  afterInstall: scripts/after-install.sh
  afterRemove: scripts/after-remove.sh
extraFiles:
  - from: scripts/launcher.sh
    to: launcher.sh
npmRebuild: true
